version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-patch-minor:
        update-types:
          - "minor"
          - "patch"
    # JavaFX major releases require a newer JDK; V34 stays on Java 21.
    ignore:
      - dependency-name: "javafx.version"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.openjfx:*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # All three CodeQL actions must use one version in every CI run.
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
    open-pull-requests-limit: 5
