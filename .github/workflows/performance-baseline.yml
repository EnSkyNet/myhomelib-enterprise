name: Performance baseline

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Synthetic catalogue sizes"
        required: false
        default: "100000,500000,700000,1000000"
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Make Maven launcher helper executable
        run: chmod +x tools/invoke-maven.sh
      - name: JVM/Lucene/reader performance suite
        env:
          PERF_SIZES: ${{ github.event.inputs.sizes || '100000,500000,700000,1000000' }}
        run: >-
          ./tools/invoke-maven.sh -B -ntp -pl myhomelib-benchmark -am test -Pperformance
          -Dmhl.performance.sizes="$PERF_SIZES"
          -Dmhl.performance.readerMb=8
      - name: Offline SQLite scale baseline
        env:
          PERF_SIZES: ${{ github.event.inputs.sizes || '100000,500000,700000,1000000' }}
        run: python3 tools/stage24-performance-baseline.py --sizes "$PERF_SIZES" --out target/performance-baseline-sqlite.json
      - name: Stage 24 contract check
        run: python3 tools/stage24-performance-check.py
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-baseline-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            myhomelib-benchmark/target/performance-baseline-jvm.json
            target/performance-baseline-sqlite.json
            docs/performance-baseline.json
            docs/PERFORMANCE_BASELINE.md
