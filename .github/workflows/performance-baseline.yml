name: Performance baseline

on:
  # Run the actual performance suite when its CI recipe changes.
  pull_request:
    paths:
      - '.github/workflows/performance-baseline.yml'
      - 'tools/stage24-performance-baseline.py'
      - 'tools/stage24-fixture-statistics-test.py'
  workflow_dispatch:
    inputs:
      sizes:
        description: "Synthetic catalogue sizes"
        required: false
        default: "100000,500000,700000,1000000"
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Make Maven launcher helper executable
        run: chmod +x tools/invoke-maven.sh
      - name: Prepare virtual display for JavaFX tests
        run: |
          # Linux CI runners are headless, but the Maven reactor also runs JavaFX
          # reader contract tests. Keep them enabled under an isolated X server.
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xauth >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb xauth
          fi
      - name: JVM/Lucene/reader performance suite
        env:
          PERF_SIZES: ${{ github.event.inputs.sizes || '100000,500000,700000,1000000' }}
        run: >-
          xvfb-run -a ./tools/invoke-maven.sh -B -ntp -pl myhomelib-benchmark -am test -Pperformance
          -Dmhl.performance.sizes="$PERF_SIZES"
          -Dmhl.performance.readerMb=8
      - name: SQLite fixture statistics regression
        run: python3 -B tools/stage24-fixture-statistics-test.py
      - name: Offline SQLite scale baseline
        env:
          PERF_SIZES: ${{ github.event.inputs.sizes || '100000,500000,700000,1000000' }}
        run: python3 tools/stage24-performance-baseline.py --sizes "$PERF_SIZES" --out target/performance-baseline-sqlite.json
      - name: Stage 24 contract check
        run: python3 tools/stage24-performance-check.py
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-baseline-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            myhomelib-benchmark/target/performance-baseline-jvm.json
            target/performance-baseline-sqlite.json
            docs/performance-baseline.json
            docs/PERFORMANCE_BASELINE.md
