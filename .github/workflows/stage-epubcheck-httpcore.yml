name: Stage and commit reviewed EPUBCheck HttpCore fix

on:
  push:
    branches:
      - security/v34-epubcheck-httpcore-upgrade-tool
    paths:
      - 'tools/apply-epubcheck-httpcore-fix.py'
      - 'tools/stage-epubcheck-httpcore-fix.py'
      - 'tools/stage-epubcheck-httpcore-fix-test.py'
      - '.github/workflows/stage-epubcheck-httpcore.yml'

permissions:
  contents: write

jobs:
  vendor-httpcore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Stage and authenticate matching HttpCore releases
        run: |
          python3 -B tools/stage-epubcheck-httpcore-fix-test.py
          python3 -B tools/stage-epubcheck-httpcore-fix.py --output "$RUNNER_TEMP/httpcore-reviewed"
          python3 -B tools/apply-epubcheck-httpcore-fix.py --staging "$RUNNER_TEMP/httpcore-reviewed"
      - name: Validate vendor inventory and disallow vulnerable JAR paths
        run: |
          python3 -B tools/vendor-binary-inventory.py --check --sbom target/vendor-bom.cdx.json
          if find tools/validators/epubcheck/lib -name 'httpcore5*-5.1.3.jar' | grep -q .; then
            echo "::error::Vulnerable HttpCore JARs remain in EPUBCheck"
            exit 1
          fi
      - name: Commit replacement binaries and manifest changes into the PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- tools/validators/epubcheck/lib/httpcore5-5.1.3.jar \
            tools/validators/epubcheck/lib/httpcore5-h2-5.1.3.jar \
            tools/validators/epubcheck/lib/httpcore5-5.4.4.jar \
            tools/validators/epubcheck/lib/httpcore5-h2-5.4.4.jar \
            tools/CONVERTERS-SHA256.txt security/binary-manifest.json security/vendor-bom.cdx.json
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::No binary replacement changes produced"; exit 1; }
          git commit -m "security(epubcheck): replace vulnerable HttpCore jars with verified 5.4.4"
          git push origin HEAD:security/v34-epubcheck-httpcore-upgrade-tool
