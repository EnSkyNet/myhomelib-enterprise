name: Source integrity
on:
  workflow_call:
permissions:
  contents: read
jobs:
  source-integrity:
    name: Source integrity and clean ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install release-check dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Source hygiene before compilation
        run: |
          python tools/project-hygiene-check.py
          python tools/empty-catch-growth-check.py
          python tools/source_archive_policy.py --tree .
          python tools/source-archive-policy-test.py
          python tools/vendor-binary-inventory.py --check --sbom target/vendor-bom.cdx.json
          python tools/vendor-binary-inventory-test.py
          python tools/supply-chain-policy-check.py
      - name: Clean source ZIP round trip
        run: python tools/source-archive-smoke.py
      - name: Retain source integrity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            target/source-archive-smoke.json
            target/vendor-bom.cdx.json
