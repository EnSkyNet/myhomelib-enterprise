name: CI and cross-platform release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package:
    name: Verify + jpackage (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python for offline guards
        if: matrix.platform == 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make Unix scripts executable
        if: matrix.platform != 'windows'
        shell: bash
        run: chmod +x mvnw *.sh

      - name: Maven verify (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: ./mvnw -B -ntp clean verify -Pproduction

      - name: Maven verify (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\mvnw.cmd -B -ntp clean verify -Pproduction

      - name: Offline architecture/regression guards
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python3 tools/static_release_check.py
          python3 tools/architecture-check.py
          python3 tools/large-library-pre-stage7-check.py
          for check in \
            tools/stage3-navigation-check.py \
            tools/stage4-navigation-check.py \
            tools/stage5-history-check.py \
            tools/stage6-online-update-check.py \
            tools/stage7-online-updates-ui-check.py \
            tools/stage8-9-filter-table-check.py \
            tools/stage10-11-rich-details-check.py \
            tools/stage12-13-collection-maintenance-check.py \
            tools/stage14-15-actions-check.py \
            tools/stage16-export-profiles-check.py \
            tools/stage17-18-opds-check.py \
            tools/stage19-20-reader-check.py \
            tools/stage21-help-genre-localization-check.py \
            tools/stage22-versioned-user-data-check.py \
            tools/stage23-cross-platform-release-check.py \
            tools/stage24-performance-check.py; do
            python3 "$check"
          done
          python3 tools/validate-language-catalogs.py

      - name: Build portable app-image and smoke it (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          MHL_SKIP_BUILD: '1'
        run: |
          ./package-portable.sh
          ./smoke-desktop.sh
          cp -f myhomelib-mcp/target/myhomelib-mcp-1.0.0.jar dist/
          cp -f myhomelib-bootstrap/target/myhomelib-bootstrap-1.0.0.jar dist/
          ./checksums.sh dist

      - name: Build portable app-image and smoke it (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:MHL_SKIP_BUILD = '1'
          .\package-portable.ps1
          .\smoke-desktop.ps1
          Copy-Item -Force 'myhomelib-mcp\target\myhomelib-mcp-1.0.0.jar' dist
          Copy-Item -Force 'myhomelib-bootstrap\target\myhomelib-bootstrap-1.0.0.jar' dist
          .\checksums.ps1 -Directory dist

      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myhomelib-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/myhomelib-mcp-*.jar
            dist/myhomelib-bootstrap-*.jar
            dist/SHA256SUMS

  publish-tag:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: myhomelib-*
          path: release-input

      - name: Assemble unique release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-input -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp '{}' release-assets/ \;
          MCP=$(find release-input -type f -name 'myhomelib-mcp-*.jar' | head -n1)
          BOOT=$(find release-input -type f -name 'myhomelib-bootstrap-*.jar' | head -n1)
          cp "$MCP" "$BOOT" release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS)
          cat release-assets/SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --title "MyHomeLib ${GITHUB_REF_NAME}" --generate-notes
          fi
