name: CI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    uses: ./.github/workflows/source-integrity.yml

  supply-chain:
    needs: source-integrity
    name: Supply-chain release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12 for release security gate
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Block release on open High/Critical code-scanning alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 tools/github-connected-acceptance.py
          --repo "$GITHUB_REPOSITORY"
          --expected-sha "$GITHUB_SHA"
          --codeql-release-gate-only
          --out-dir target/github-release-codeql-gate

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Date-stamp NVD cache
        id: nvd-cache-date
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Dependency-Check vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/dependency-check-data-v12
          key: dependency-check-v12-${{ runner.os }}-${{ steps.nvd-cache-date.outputs.date }}-${{ hashFiles('pom.xml', 'security/dependency-check-suppressions.xml') }}
          restore-keys: |
            dependency-check-v12-${{ runner.os }}-

      - name: Ensure Maven launcher helper is executable
        run: chmod +x tools/invoke-maven.sh

      - name: Validate supply-chain policy
        run: python3 tools/supply-chain-policy-check.py

      - name: Set up Python for vendor review
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify vendor binaries and generate supplementary SBOM
        run: python tools/vendor-binary-inventory.py --check --sbom target/vendor-bom.cdx.json

      - name: Require NVD credentials for blocking release SCA
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "::error::NVD_API_KEY secret is absent. Blocking release SCA cannot pass without vulnerability data."
            exit 1
          fi

      - name: Generate CycloneDX SBOM and scan dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./tools/invoke-maven.sh -B -ntp -DskipTests -Psbom,dependency-check verify

      - name: Require actual vendor JAR scan coverage
        run: python tools/vendor-binary-inventory.py --check --sca-report target/dependency-check-report.json

      - name: Require both release SBOM formats
        shell: bash
        run: test -s target/bom.json && test -s target/bom.xml

      - name: Upload release supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: myhomelib-supply-chain
          if-no-files-found: error
          retention-days: 30
          path: |
            target/bom.json
            target/bom.xml
            target/github-release-codeql-gate/**
            target/vendor-bom.cdx.json
            **/target/dependency-check-report.html
            **/target/dependency-check-report.json
            **/target/dependency-check-report.sarif

  package:
    name: Verify + package (${{ matrix.platform }})
    needs: supply-chain
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install release-check Python dependencies
        if: matrix.platform == 'linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: Full production Maven verification (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\tools\invoke-maven.ps1 clean verify -Pproduction

      - name: Install virtual display for Linux verification
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0

      - name: Full production Maven verification (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: xvfb-run -a ./tools/invoke-maven.sh -B -ntp -Pproduction clean verify

      - name: Full production Maven verification (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: ./tools/invoke-maven.sh -B -ntp -Pproduction clean verify

      - name: Source/static release validation
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python3 tools/static_release_check.py
          python3 tools/static-release-source-count-test.py
          python3 tools/empty-catch-growth-check.py

      - name: Windows acceptance harness structure
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python tools/windows-acceptance-harness-check.py

      - name: Package portable app-image (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:MHL_SKIP_BUILD = "1"
          .\package-portable.ps1

      - name: Package portable app-image (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          export MHL_SKIP_BUILD=1
          ./package-portable.sh

      - name: Smoke packaged launcher (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\smoke-desktop.ps1

      - name: Smoke packaged converter and validator tools (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\tools\smoke-runtime-tools.ps1

      - name: Smoke extracted portable archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\smoke-portable.ps1

      - name: Smoke packaged launcher (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: ./smoke-desktop.sh

      - name: Smoke packaged converter and validator tools (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: ./tools/smoke-runtime-tools.sh

      - name: Smoke extracted portable archive (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: ./smoke-portable.sh

      - name: Ensure WiX is available for Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = "$machinePath;$userPath"
          }

      - name: Windows MSI install / upgrade / uninstall acceptance
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:MHL_SKIP_BUILD = "1"
          .\tools\windows-installer-acceptance.ps1

      - name: Validate automated Windows acceptance evidence
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python tools/windows-acceptance-evidence-check.py --root target

      - name: Upload Windows installer acceptance logs
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-acceptance-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            target/windows-installer-acceptance/**
            target/windows-portable-acceptance/**
            target/windows-ui-acceptance-*.md
            target/windows-ui-acceptance-*.json
            target/*-evidence/*.png
            target/windows-final-acceptance-evidence.zip*

      - name: Package per-user Windows EXE installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:MHL_SKIP_BUILD = "1"
          .\package-desktop.ps1 -Type exe

      - name: Scan final app-image before removal (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          .\tools\invoke-maven.ps1 -B -ntp -DskipTests -Pdependency-check verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/vendor-binary-inventory.py --check --sca-report target/dependency-check-report.json --image-root dist

      - name: Scan final app-image before removal (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./tools/invoke-maven.sh -B -ntp -DskipTests -Pdependency-check verify
          python tools/vendor-binary-inventory.py --check --sca-report target/dependency-check-report.json --image-root dist

      - name: Retain platform test and scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-verification-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/dependency-check-report.*

      - name: Remove intermediate app-image before publication checksums (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force "dist\MyHomeLib" -ErrorAction SilentlyContinue

      - name: Remove intermediate app-image before publication checksums (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: rm -rf dist/MyHomeLib dist/MyHomeLib.app

      - name: Add standalone JAR artifacts (Linux release bundle only)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('pom.xml').getroot(); ns={'m':'http://maven.apache.org/POM/4.0.0'}
          print(root.findtext('m:version', namespaces=ns))
          PY
          )
          cp "myhomelib-bootstrap/target/myhomelib-bootstrap-${VERSION}.jar" dist/
          cp "myhomelib-mcp/target/myhomelib-mcp-${VERSION}.jar" dist/

      - name: Generate checksums (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\checksums.ps1 -Directory dist

      - name: Generate checksums (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: ./checksums.sh dist

      - name: Validate release artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python tools/stage23-cross-platform-release-check.py --dist dist --require-checksums --require-portable --expect-installer --expect-windows-msi --expect-windows-exe

      - name: Validate release artifacts (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: python3 tools/stage23-cross-platform-release-check.py --dist dist --require-checksums --require-portable

      - name: Generate candidate-bound release integrity manifest
        shell: bash
        run: >-
          python tools/release-candidate-integrity.py
          --root .
          --dist dist
          --platform "${{ matrix.platform }}"
          --candidate-sha "$GITHUB_SHA"
          --out "target/release-candidate-integrity/release-candidate-integrity-${{ matrix.platform }}.json"

      - name: Verify candidate-bound release integrity manifest
        shell: bash
        run: >-
          python tools/release-candidate-integrity.py
          --verify
          --root .
          --dist dist
          --platform "${{ matrix.platform }}"
          --candidate-sha "$GITHUB_SHA"
          --out "target/release-candidate-integrity/release-candidate-integrity-${{ matrix.platform }}.json"

      - name: Upload platform release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: myhomelib-${{ matrix.platform }}
          path: |
            dist/MyHomeLib-R18-*-portable-windows-*.zip
            dist/myhomelib-*.zip
            dist/myhomelib-*.tar.gz
            dist/MyHomeLib-*.exe
            dist/MyHomeLib-*.msi
            dist/myhomelib-bootstrap-*.jar
            dist/myhomelib-mcp-*.jar
            dist/SHA256SUMS
            target/release-candidate-integrity/release-candidate-integrity-${{ matrix.platform }}.json
            target/release-candidate-integrity/release-candidate-integrity-${{ matrix.platform }}.json.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source for version guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify tag matches pom.xml version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('pom.xml').getroot(); ns={'m':'http://maven.apache.org/POM/4.0.0'}
          print(root.findtext('m:version', namespaces=ns))
          PY
          )
          [[ "$TAG_NAME" == "v$VERSION" ]] || {
            echo "Tag $TAG_NAME does not match pom.xml version v$VERSION" >&2
            exit 1
          }

      - name: Download all platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: myhomelib-*
          path: release-downloads

      - name: Build one collision-free release directory and unified checksums
        shell: bash
        run: |
          mkdir -p release-files
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            [[ "$name" == "SHA256SUMS" ]] && continue
            if [[ -e "release-files/$name" ]]; then
              echo "Duplicate release filename: $name" >&2
              exit 1
            fi
            cp "$file" "release-files/$name"
          done < <(find release-downloads -type f -print0)
          (
            cd release-files
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | while IFS= read -r -d '' file; do sha256sum "$file"; done > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Create GitHub Release once
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
