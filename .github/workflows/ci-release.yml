name: CI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python for offline guards
        if: matrix.platform == 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: matrix.platform == 'linux'
        run: |
          pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      - name: Run tests
        run: |
          mvn test

      - name: Run release smoke check
        if: matrix.platform == 'linux'
        run: |
          java -jar myhomelib-bootstrap/target/myhomelib-bootstrap-*.jar --release-smoke

      - name: Run Python release validation
        if: matrix.platform == 'linux'
        run: |
          python tools/stage23-cross-platform-release-check.py

      - name: Prepare distribution artifacts
        run: |
          mkdir -p dist
          cp myhomelib-bootstrap/target/*.jar dist/
          cp myhomelib-mcp/target/*.jar dist/
          cp README.md dist/
          cp LICENSE dist/

      - name: Generate checksums (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File | 
            Where-Object { $_.Name -ne 'SHA256SUMS' } | 
            Sort-Object FullName | 
            ForEach-Object {
              $rel = $_.FullName -replace "$(Get-Location | Select-Object -ExpandProperty Path)\\dist\\", ""
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              "$hash  $rel"
            } | Out-File dist/SHA256SUMS -Encoding UTF8

      - name: Generate checksums (Linux/macOS)
        if: matrix.platform != 'windows-latest'
        run: |
          cd dist
          for f in *; do
            if [ "$f" != "SHA256SUMS" ] && [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS
            fi
          done
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myhomelib-${{ matrix.platform }}
          path: dist/
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}