name: V34 Windows test-only portable

# Deliberately NOT a GitHub Release: no tags, publishing token or production rollout.
# A merged change to this workflow builds one SHA-bound Windows test artifact.
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/windows-test-portable.yml
      # Rebuild test-only Portable for production code changes, including the Updates sidebar.
      - 'myhomelib-*/src/main/**'
      # Test-only crash-recovery changes must rebuild the same SHA-bound Portable.
      - 'myhomelib-*/src/test/**'
      - pom.xml
      - .mvn/**
      - mvnw
      # Retest Portable whenever its launch, smoke, packaging or evidence scripts change.
      - smoke-portable.ps1
      - smoke-desktop.ps1
      - package-portable.ps1
      - package-desktop.ps1
      - checksums.ps1
      - tools/smoke-runtime-tools.ps1
      - tools/windows-acceptance-harness-check.py
      - tools/release-candidate-integrity.py
      - tools/stage23-cross-platform-release-check.py
      - tools/provision-test-portable-fbc.ps1
      # Retest packaged Windows Portable when the incoming-folder SQLite backlog
      # fix changes; do not publish a release or bypass the production Maven gate.
      - myhomelib-infrastructure/src/main/java/com/myhomelibcorp/infrastructure/collection/watch/IncomingFolderWatchAdapter.java
      - myhomelib-infrastructure/src/test/java/com/myhomelibcorp/infrastructure/collection/watch/IncomingFolderWatchAdapterTest.java
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-portable-${{ github.sha }}
  cancel-in-progress: false

jobs:
  portable:
    name: Verify and build Windows test-only Portable
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Full production Maven clean verify on Windows
        shell: pwsh
        timeout-minutes: 80
        run: |
          .\tools\invoke-maven.ps1 -B -ntp -Pproduction clean verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Windows acceptance harness and packaging policy
        shell: pwsh
        run: |
          python tools/windows-acceptance-harness-check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/supply-chain-policy-check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Provision pinned and SHA-256-verified Windows FB2 converter
        shell: pwsh
        run: |
          .\tools\provision-test-portable-fbc.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows native-runtime Portable archive
        shell: pwsh
        run: |
          $env:MHL_SKIP_BUILD = '1'
          .\package-portable.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keep each smoke in its own Actions step. PowerShell scripts which only call
      # cmdlets do not necessarily set $LASTEXITCODE; checking it after a .ps1 can
      # exit the whole step with code 0 before the remaining checks run.
      - name: Smoke packaged native desktop launcher
        shell: pwsh
        timeout-minutes: 5
        run: |
          & pwsh -NoProfile -NonInteractive -File .\smoke-desktop.ps1
          if ($LASTEXITCODE -ne 0) { throw "Packaged desktop launcher smoke failed with exit code $LASTEXITCODE" }

      - name: Smoke bundled FB2 to EPUB conversion and EPUBCheck
        shell: pwsh
        timeout-minutes: 10
        run: |
          & pwsh -NoProfile -NonInteractive -File .\tools\smoke-runtime-tools.ps1
          if ($LASTEXITCODE -ne 0) { throw "Packaged runtime tools smoke failed with exit code $LASTEXITCODE" }

      - name: Smoke extracted Unicode-path Windows Portable
        shell: pwsh
        timeout-minutes: 15
        run: |
          & pwsh -NoProfile -NonInteractive -File .\smoke-portable.ps1
          if ($LASTEXITCODE -ne 0) { throw "Extracted Unicode portable smoke failed with exit code $LASTEXITCODE" }
          $smokeReport = 'target/windows-portable-acceptance/portable-smoke.json'
          $smokeMarkdown = 'target/windows-portable-acceptance/portable-smoke.md'
          foreach ($report in @($smokeReport, $smokeMarkdown)) {
            if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
              throw "Missing Windows Portable smoke evidence after execution: $report"
            }
            if ((Get-Item -LiteralPath $report).Length -le 0) {
              throw "Empty Windows Portable smoke evidence after execution: $report"
            }
          }
          $smoke = Get-Content -LiteralPath $smokeReport -Raw | ConvertFrom-Json
          if ($smoke.overall -ne 'PASS' -or -not $smoke.markerPresent -or -not $smoke.bundledRuntimePresent -or -not $smoke.portableDataCreated) {
            throw "Extracted Windows Portable smoke report has failed or incomplete acceptance evidence"
          }
          Write-Host "All three separate Windows Portable smoke stages passed."

      - name: Restrict payload to a single test-only ZIP and create checksums
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force 'dist\MyHomeLib' -ErrorAction SilentlyContinue
          $archives = @(Get-ChildItem -Path dist -Filter 'MyHomeLib-R18-*-portable-windows-*.zip' -File)
          if ($archives.Count -ne 1) { throw "Exactly one Portable ZIP is required, got $($archives.Count)" }
          $extra = @(Get-ChildItem -Path dist -File | Where-Object { $_.FullName -ne $archives[0].FullName })
          if ($extra.Count -gt 0) { throw "Unexpected dist files: $($extra.Name -join ', ')" }
          .\checksums.ps1 -Directory dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/stage23-cross-platform-release-check.py --dist dist --require-checksums --require-portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bind artifact contents to exact candidate SHA
        shell: pwsh
        run: |
          $manifest = 'target/release-candidate-integrity/release-candidate-integrity-windows.json'
          python tools/release-candidate-integrity.py --root . --dist dist --platform windows --candidate-sha "$env:GITHUB_SHA" --out $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release-candidate-integrity.py --verify --root . --dist dist --platform windows --candidate-sha "$env:GITHUB_SHA" --out $manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "### Windows Portable — TEST ONLY" >> $env:GITHUB_STEP_SUMMARY
          "Candidate SHA: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Windows JDK 21 production verify, native launcher/runtime/Unicode Portable smoke and SHA-256 checks passed." >> $env:GITHUB_STEP_SUMMARY
          "Unsigned test artifact; physical Windows 11 4 GB acceptance is still required." >> $env:GITHUB_STEP_SUMMARY

      - name: Require complete SHA-bound smoke and integrity evidence
        shell: pwsh
        run: |
          $required = @(
            'dist/SHA256SUMS',
            'target/release-candidate-integrity/release-candidate-integrity-windows.json',
            'target/release-candidate-integrity/release-candidate-integrity-windows.json.sha256',
            'target/windows-portable-acceptance/portable-smoke.json',
            'target/windows-portable-acceptance/portable-smoke.md'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing mandatory Windows Portable evidence file: $file"
            }
            if ((Get-Item -LiteralPath $file).Length -le 0) {
              throw "Empty mandatory Windows Portable evidence file: $file"
            }
          }
          $record = Get-Content -LiteralPath 'target/release-candidate-integrity/release-candidate-integrity-windows.json' -Raw | ConvertFrom-Json
          if ($record.candidateSha -ne $env:GITHUB_SHA -or $record.platform -ne 'windows' -or $record.overall -ne 'PASS') {
            throw "Windows Portable integrity manifest is not PASS-bound to the exact master SHA"
          }
          $smoke = Get-Content -LiteralPath 'target/windows-portable-acceptance/portable-smoke.json' -Raw | ConvertFrom-Json
          if ($smoke.overall -ne 'PASS') {
            throw "Windows Portable extracted smoke evidence did not pass"
          }
          $artifactFiles = @(Get-ChildItem -Path 'dist' -File)
          if ($artifactFiles.Count -ne 2) { throw "Portable dist must contain exactly one ZIP and one SHA256SUMS file" }
          Write-Host "Windows Portable SHA-bound evidence: PASS"

      - name: Upload exact-SHA test-only Windows Portable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v34-test-only-windows-portable-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/MyHomeLib-R18-*-portable-windows-*.zip
            dist/SHA256SUMS
            target/release-candidate-integrity/release-candidate-integrity-windows.json
            target/release-candidate-integrity/release-candidate-integrity-windows.json.sha256
            target/windows-portable-acceptance/portable-smoke.json
            target/windows-portable-acceptance/portable-smoke.md
