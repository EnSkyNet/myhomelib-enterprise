name: Apply verified EPUBCheck HttpClient security update

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/upgrade-epubcheck-httpclient.yml'
      - 'tools/stage-epubcheck-httpclient-fix.py'
      - 'tools/apply-epubcheck-httpclient-fix.py'
      - 'tools/test-epubcheck-httpclient-fix.py'
      - 'tools/stage-epubcheck-httpclient-fix-test.py'
      - 'tools/tests/epubcheck/HttpClientPoolLeakProbe.java'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: epubcheck-httpclient-security-update
  cancel-in-progress: false

jobs:
  update:
    name: Verify, apply and commit HttpClient 5.6.5 on master
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current master with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test offline staging safety
        run: python3 -B tools/stage-epubcheck-httpclient-fix-test.py

      - name: Download and verify Apache Maven Central release
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/validators/epubcheck/lib/httpclient5-5.6.5.jar ]; then
            python3 -B tools/stage-epubcheck-httpclient-fix.py --output target/epubcheck-httpclient-stage
            python3 -B tools/apply-epubcheck-httpclient-fix.py --staging target/epubcheck-httpclient-stage
          else
            echo "HttpClient 5.6.5 is already present; no vendor mutation required."
          fi

      - name: Verify EPUBCheck runtime, manifest and Content-Encoding pool recovery
        run: python3 -B tools/test-epubcheck-httpclient-fix.py

      - name: Verify vendor hashes and regenerate supplementary SBOM
        run: python3 -B tools/vendor-binary-inventory.py --check --sbom security/vendor-bom.cdx.json

      - name: Commit verified vendor replacement to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- tools/validators/epubcheck security/binary-manifest.json security/vendor-bom.cdx.json tools/CONVERTERS-SHA256.txt
          if git diff --cached --quiet; then
            echo "No vendor changes to commit."
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "fix(security): upgrade EPUBCheck HttpClient to 5.6.5"
          git push origin HEAD:master
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: commit

      - name: Dispatch full Windows and CodeQL verification for updated master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/windows-full-verify.yml/dispatches" -f ref=master
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/windows-test-portable.yml/dispatches" -f ref=master
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/dispatches" -f ref=master
          echo "Dispatched Windows full verify, Portable smoke and CodeQL on master."
