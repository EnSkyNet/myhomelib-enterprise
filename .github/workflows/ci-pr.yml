name: PR CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Ensure Maven launcher helper is executable
        shell: bash
        run: chmod +x tools/invoke-maven.sh

      - name: Compile production and test sources
        shell: bash
        run: ./tools/invoke-maven.sh -B -ntp -DskipTests test-compile

      - name: Fast core unit tests
        shell: bash
        run: >-
          ./tools/invoke-maven.sh -B -ntp
          -pl myhomelib-shared,myhomelib-domain,myhomelib-application,myhomelib-opds
          test

      - name: Migration and security regression tests
        shell: bash
        run: >-
          ./tools/invoke-maven.sh -B -ntp
          -pl myhomelib-infrastructure -am
          -Dtest=DatabaseMigrationMatrixTest,DatabaseMigrationAdapterLegacyGuardIntegrationTest,LegacyMigrationDataGuardTest,OnlineHttpPolicyTest,SqliteCollectionRepositoryCredentialsV7Test,ArchiveImportSupportTest,ZipArchiveReaderTransparencyTest,LocalCopyDeletionRecoveryStoreTest,SimpleEventBusTest,AsyncConfigTest,MemoryMonitorTest,FolderSyncAsyncExecutorTest,SpringExecutorAdapterTest,EditBookTransactionalConsistencyTest,PlatformSecretStoreProviderTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: JavaFX lifecycle and async workspace regression
        shell: bash
        run: >-
          ./tools/invoke-maven.sh -B -ntp
          -pl myhomelib-ui -am
          -Dtest=UiSubscriptionsLifecycleTest,FxmlLoaderFactoryLifecycleTest,AsyncWorkspaceControllerContractTest,UiAsyncRequestGuardTest,ClassicEditAsyncContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: UTF-8 and non-ASCII path regression (C.UTF-8)
        shell: bash
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: >-
          ./tools/invoke-maven.sh -B -ntp
          -pl myhomelib-application,myhomelib-shared -am
          -Dtest=KnowledgeMarkdownExportServiceTest,AnnotationDigestServiceTest,RuntimeEncodingGuardTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Install virtual display for JavaFX tests
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Display-capable JavaFX FXML/UI tests
        shell: bash
        run: >-
          xvfb-run -a
          ./tools/invoke-maven.sh -B -ntp
          -pl myhomelib-ui -am
          -Dtest='*FxTest'
          -Dui.testfx.headless=false
          -Dui.java.awt.headless=false
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Require executed JavaFX tests
        shell: bash
        run: python3 tools/fx-test-execution-check.py myhomelib-ui/target/surefire-reports --min-tests 8 --min-suites 6

      - name: Privacy and external-reader temp lifecycle regression
        shell: bash
        run: >-
          ./tools/invoke-maven.sh -B -ntp
          -pl myhomelib-ui -am
          -Dtest=ExternalReaderMaterializationCacheTest,RunBookActionMaterializationLifecycleTest,SupportBundleServicePrivacyTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Startup orchestration regression
        shell: bash
        run: >-
          ./tools/invoke-maven.sh -B -ntp
          -pl myhomelib-bootstrap -am
          -Dtest=com.myhomelibcorp.startup.*Test
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Startup orchestration policy ratchet
        shell: bash
        run: python3 tools/startup-orchestration-check.py

      - name: Privacy and temp-file policy ratchet
        shell: bash
        run: python3 tools/privacy-temp-lifecycle-check.py

      - name: Native SecretStore policy ratchet
        shell: bash
        run: python3 tools/secret-store-policy-check.py

      - name: Architecture boundaries
        shell: bash
        run: >-
          ./tools/invoke-maven.sh -B -ntp
          -pl myhomelib-architecture-tests -am
          -Dtest=LayerArchitectureTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: End-to-end regression journeys
        shell: bash
        run: >-
          ./tools/invoke-maven.sh -B -ntp
          -pl myhomelib-e2e-tests -am
          -Dtest=ImportSearchReaderJourneyE2ETest,BackupRestoreJourneyE2ETest,CollectionRollbackJourneyE2ETest,OpdsJourneyE2ETest,ReaderCorpusJourneyE2ETest,AnnotationLifecycleJourneyE2ETest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Static XML/archive security gate
        shell: bash
        run: python3 tools/xml-archive-security-check.py

      - name: Language catalogue format consistency
        shell: bash
        run: python3 tools/validate-language-catalogs.py

      - name: Critical UI localization literals and stable keys
        shell: bash
        run: python3 tools/check-critical-ui-localization.py

      - name: Managed executor and backpressure policy
        shell: bash
        run: python3 tools/managed-executor-check.py

      - name: Spring constructor wiring policy
        shell: bash
        run: python3 tools/spring-constructor-wiring-check.py

      - name: Spring proxyability policy
        shell: bash
        run: python3 tools/spring-proxyability-check.py

      - name: Full Spring context startup smoke
        shell: bash
        run: >-
          ./tools/invoke-maven.sh -B -ntp
          -pl myhomelib-bootstrap -am
          -Dtest=SpringContextStartupSmokeTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Windows acceptance harness structure
        shell: bash
        run: python3 tools/windows-acceptance-harness-check.py

      - name: Windows acceptance evidence validator regression
        shell: bash
        run: python3 tools/windows-acceptance-evidence-check-test.py

      - name: External evidence ZIP safety regression
        shell: bash
        run: python3 tools/zip-evidence-safety-test.py

      - name: Supply-chain policy structure
        shell: bash
        run: python3 tools/supply-chain-policy-check.py

      - name: GitHub connected acceptance policy regression
        shell: bash
        run: python3 tools/github-connected-acceptance-test.py

      - name: GitHub acceptance artifact ingest regression
        shell: bash
        run: python3 tools/github-acceptance-artifact-ingest-test.py

      - name: Windows acceptance harness candidate-binding regression
        shell: bash
        run: python3 tools/windows-acceptance-harness-binding-test.py

      - name: External evidence aggregator compatibility regression
        shell: bash
        run: python3 tools/v71-final-external-acceptance-check-test.py

      - name: Reviewer bundle integrity compatibility regression
        shell: bash
        run: python3 tools/v71-final-evidence-bundle-check-test.py

      - name: Release candidate integrity regression
        shell: bash
        run: python3 tools/release-candidate-integrity-test.py

      - name: External acceptance readiness regression
        shell: bash
        run: python3 tools/external-acceptance-readiness-test.py

      - name: External acceptance readiness
        shell: bash
        run: python3 tools/external-acceptance-readiness.py

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*.log
            target/diagnostics/**

  windows-secret-store:
    name: Windows DPAPI secret-store gate
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: SecretStore migration + real DPAPI tests
        shell: pwsh
        run: >-
          .\tools\invoke-maven.ps1 -B -ntp
          -pl myhomelib-infrastructure -am
          -Dtest=CredentialMasterKeyManagerTest,PlatformSecretStoreProviderTest,WindowsDpapiSecretStoreIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Dependency-Check vulnerability data
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-utils
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml', 'security/dependency-check-suppressions.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Ensure Maven launcher helper is executable
        run: chmod +x tools/invoke-maven.sh

      - name: Scan dependencies (CVSS 7+ blocks)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./tools/invoke-maven.sh -B -ntp -DskipTests -Pdependency-check verify

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-pr-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.json
            **/target/dependency-check-report.sarif
