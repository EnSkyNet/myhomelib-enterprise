# Специфічні налаштування для PROD профілю
logging:
  level:
    com.myhomelibcorp: WARN
    com.myhomelibcorp.ui.service.BookDownloadCoordinator: INFO
    com.myhomelibcorp.ui.details.BookDetailsAnalysisService: INFO
    com.myhomelibcorp.application.usecase.conversion.ConvertBookUseCase: INFO
    com.myhomelibcorp.converter.toolchain.ToolchainBookConverter: INFO
    com.myhomelibcorp.converter.toolchain.engine.fbc.FbcEngine: INFO
    com.myhomelibcorp.application.content.maintenance.ContentIndexMaintenanceService: INFO
    javafx.css: ERROR
    org.springframework: ERROR
    org.flywaydb: WARN
    org.sqlite: WARN
    org.apache.lucene: WARN
    com.zaxxer.hikari: WARN
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  import:
    batch-size: 1000
  search:
    index-path: ${user.home}/.myhomelibcorp/search-index
