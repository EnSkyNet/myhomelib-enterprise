# Специфічні налаштування для PROD профілю
logging:
  level:
    com.myhomelibcorp: WARN
    org.springframework: ERROR
    org.flywaydb: WARN
    org.sqlite: WARN
    org.apache.lucene: WARN
    com.zaxxer.hikari: WARN
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  import:
    batch-size: 1000
  search:
    index-path: ${user.home}/.myhomelibcorp/search-index

spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=60m
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 120000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized