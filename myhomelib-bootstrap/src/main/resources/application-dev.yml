# Специфічні налаштування для DEV профілю
logging:
  level:
    com.myhomelibcorp: DEBUG
    org.springframework: DEBUG
    org.sqlite: DEBUG
    com.zaxxer.hikari: DEBUG
  charset:
    console: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  search:
    index-path: ${user.home}/.myhomelibcorp/search-index

spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      leak-detection-threshold: 30000