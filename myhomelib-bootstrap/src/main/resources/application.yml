spring:
  main:
    # Desktop startup is intentionally lazy: optional feature graphs are created on first use.
    # SpringContextStartupSmokeTest forces this off in CI so wiring errors still fail fast.
    lazy-initialization: true
    allow-circular-references: false
    allow-bean-definition-overriding: false
  application:
    name: MyHomeLib Enterprise

app:
  metadata:
    db-path: ${user.home}/.myhomelibcorp/meta.db
  import:
    batch-size: 1000
    change-tracking-limit: 50000
    # Remote and large (100k+) full INPX snapshots use bounded 5000-row flushes.
    # This is the benchmarked compromise between SQLite/JDBC overhead and transaction memory pressure.
    online-batch-size: 5000
    large-catalog-batch-size: 5000
  search:
    index-path: ${user.home}/.myhomelibcorp/search-index

logging:
  level:
    root: WARN
    # Production defaults: keep lifecycle/business milestones, suppress per-item diagnostics.
    com.myhomelibcorp: INFO
    com.myhomelibcorp.infrastructure.resource.BookResourceResolver: WARN
    com.myhomelibcorp.infrastructure.download: WARN
    com.myhomelibcorp.infrastructure.persistence.sqlite.helper: WARN
    com.myhomelibcorp.ui.presenter.CoverPresenter: INFO
    com.zaxxer.hikari: WARN
    org.springframework: WARN
    org.flywaydb: WARN
    org.sqlite: WARN
    org.apache.lucene: WARN
    org.apache.lucene.internal.vectorization.VectorizationProvider: ERROR
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{48} - %msg%n"
  file:
    name: ${user.home}/.myhomelibcorp/logs/myhomelib.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 100MB
