spring:
  main:
    allow-circular-references: false
    allow-bean-definition-overriding: false
  application:
    name: MyHomeLib Enterprise

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  datasource:
    url: jdbc:sqlite:placeholder
    driver-class-name: org.sqlite.JDBC

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=30m

app:
  metadata:
    db-path: ${user.home}/.myhomelibcorp/meta.db
  import:
    batch-size: 5000
    index-disable-threshold: 500000
  search:
    index-path: ${user.home}/.myhomelibcorp/search-index
  features:
    new-importer: true
    new-navigation: true
    virtual-table: true
    lazy-search: true
    async-cover-loading: true
    use-fts5: false

logging:
  level:
    com.myhomelibcorp: DEBUG
    org.springframework: INFO
    org.flywaydb: INFO
    org.sqlite: WARN
    org.apache.lucene: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always