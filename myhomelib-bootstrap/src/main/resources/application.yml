spring:
  profiles:
    active: dev  # можна змінити на prod для продакшну
  main:
    allow-circular-references: false
    allow-bean-definition-overriding: false
  application:
    name: MyHomeLib Enterprise

  datasource:
    url: jdbc:sqlite:${user.home}/.myhomelibcorp/library.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=30m

app:
  search:
    index-path: ./search-index

logging:
  level:
    com.myhomelibcorp: DEBUG
    org.springframework: INFO
    org.flywaydb: INFO
    org.sqlite: WARN
    org.apache.lucene: INFO